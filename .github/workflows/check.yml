name: Check ballot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: check-ballot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check
        env:
          URL: ${{ secrets.URL }}
          TOPIC: ${{ secrets.TOPIC }}
        run: python monitor_once.py
