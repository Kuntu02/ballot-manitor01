name: Check ballot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: check-ballot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check
        env:
          URL: ${{ secrets.URL }}
          TOPIC: ${{ secrets.TOPIC }}
        run: python monitor_once.py
      - name: Restart itself
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh workflow run check.yml -R ${{ github.repository }} --ref ${{ github.ref_name }}
